services:
  postgres:
    image: postgres:16-alpine
    container_name: pixelcraft-salon-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pixelcraft_salon
    volumes:
      - pixelcraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixelcraft_salon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pixelcraft_pgdata:
